[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "video-rag"
version = "0.2.0"
description = "Local YouTube library with hosted transcription and hybrid RAG chat"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "jinja2>=3.1,<4",
  "pydantic>=2.8,<3",
  "pytubefix>=8.0,<11",
  "mcp>=2,<3",
]

[project.optional-dependencies]
test = ["httpx2>=2,<3"]

[project.scripts]
video-rag = "rag_app.presentation.web:run"
video-rag-mcp = "rag_app.presentation.mcp_server:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
